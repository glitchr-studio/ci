# php-package.yml run here on every package that calls it, as each package's
# own ci.yml does: a change to the shared workflow or to the image is seen
# against all of them before they meet it. The core's harness job is its
# own (omnibase's ci.yml), not run here.
name: selftest

on:
  push:
    branches: [main]
    paths: ['.github/workflows/php-package.yml', '.github/workflows/selftest.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    name: ${{ matrix.repository }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - repository: glitchr-omnisense/omnibase
            ref: 4.x
            phpunit: false
            consumer-require: 'omnisense/omniauth:1.x-dev omniauth/oauth:1.x-dev omniauth/passkey:1.x-dev omniauth/totp:1.x-dev'
            consumer-script: 'OMNIBASE_AUTOLOAD="$PWD/vendor/autoload.php" php "$PACKAGE_DIR/docker/bin/bare"'
          - {repository: glitchr-omnisense/omnibridge, smoke: 'Omnibridge\Runtime'}
          - {repository: glitchr-omnisense/omnibridge-symfony, smoke: 'Omnibridge\Symfony\OmnibridgeBundle'}
          - {repository: glitchr-omnisense/omnibridge-laravel, smoke: 'Omnibridge\Laravel\OmnibridgeServiceProvider'}
          - {repository: glitchr-omnisense/omnibridge-twig, smoke: 'Omnibridge\Twig\ContractExtension'}
          - {repository: glitchr-omnisense/omnibridge-doctrine, smoke: 'Omnibridge\Doctrine\NamingStrategy'}
          - {repository: glitchr-omnisense/omnibridge-react, smoke: 'Omnibridge\React\Protocol'}
          - {repository: glitchr-omnisense/omnibridge-composer, smoke: 'Omnibridge\Composer\Patch\Diff'}
          - {repository: glitchr-omnisense/omniauth, smoke: 'Omniauth\Omniauth'}
          - {repository: glitchr-omnisense/omniauth-passkey, smoke: 'Omniauth\Passkey\PasskeyMethod'}
          - {repository: glitchr-omnisense/omniauth-totp, smoke: 'Omniauth\Totp\TotpMethod'}
          - {repository: glitchr-omnisense/omniauth-oauth, smoke: 'Omniauth\OAuth\OAuthMethod'}
          - {repository: glitchr-omnisense/omnisearch, smoke: 'Omnisearch\Registry'}
          - {repository: glitchr-omnisense/omnisearch-typesense, smoke: 'Omnisearch\Typesense\TypesenseDriverFactory', typesense: 'typesense/typesense:30.0.rca41'}
          - {repository: glitchr-studio/typesense-bundle, smoke: 'Typesense\Bundle\TypesenseInterface', typesense: 'typesense/typesense:27.1'}
    uses: ./.github/workflows/php-package.yml
    with:
      repository: ${{ matrix.repository }}
      ref: ${{ matrix.ref || '' }}
      smoke-class: ${{ matrix.smoke }}
      typesense-image: ${{ matrix.typesense || '' }}
      phpunit: ${{ matrix.phpunit != false }}
      phpstan: ${{ matrix.phpstan != false }}
      consumer-require: ${{ matrix.consumer-require || '' }}
      consumer-script: ${{ matrix.consumer-script || '' }}
