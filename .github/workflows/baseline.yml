# Writes the PHPStan baseline of one or several packages, in the same image
# and the same fresh install as php-package.yml, and uploads each as the
# artifact baseline-<repository>: what a package commits as
# phpstan-baseline.neon beside a phpstan.neon of the same level and paths.
#
#   gh workflow run baseline.yml -R glitchr-studio/ci \
#     -f packages='[{"repository": "omnibridge", "ref": "1.x", "paths": "src tests"}]'
#
# "exclude" (space separated, optional) lists the paths left out;
# "require-dev" (optional) what the package's require-dev is about to take,
# e.g. "phpstan/phpstan:^2.1". The
# package's own PHPStan runs when its require-dev has one, the image's
# otherwise, as in php-package.yml.
name: baseline

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'JSON list of {"repository", "ref", "paths", "exclude"?} under glitchr-studio'
        required: true
      level:
        description: PHPStan level
        default: max

permissions:
  contents: read
  packages: read

jobs:
  baseline:
    name: ${{ matrix.package.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    container:
      image: ghcr.io/glitchr-studio/php:8.4
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    env:
      COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: glitchr-studio/${{ matrix.package.repository }}
          ref: ${{ matrix.package.ref }}

      - name: Install (alone, dependencies resolved afresh)
        env:
          REQUIRE_DEV: ${{ matrix.package.require-dev }}
        run: |
          if [ -n "$REQUIRE_DEV" ]; then composer require --dev --no-update $REQUIRE_DEV; fi
          composer update --no-progress --prefer-dist

      - name: Write the baseline
        env:
          PATHS: ${{ matrix.package.paths }}
          EXCLUDE: ${{ matrix.package.exclude }}
          LEVEL: ${{ inputs.level }}
        run: |
          {
            echo "parameters:"
            echo "    level: $LEVEL"
            echo "    paths:"
            for p in $PATHS; do echo "        - $p"; done
            if [ -n "$EXCLUDE" ]; then
              echo "    excludePaths:"
              for p in $EXCLUDE; do echo "        - $p"; done
            fi
          } > phpstan.ci.neon
          cat phpstan.ci.neon
          phpstan=phpstan; [ -x vendor/bin/phpstan ] && phpstan=vendor/bin/phpstan
          $phpstan --version
          $phpstan analyse -c phpstan.ci.neon --no-progress --memory-limit=2G --allow-empty-baseline --generate-baseline=phpstan-baseline.neon
          echo "Entries: $(grep -c 'message:' phpstan-baseline.neon || true), errors: $(grep -E '^\s+count:' phpstan-baseline.neon | awk '{s+=$2} END {print s+0}')"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-${{ matrix.package.repository }}
          path: phpstan-baseline.neon
