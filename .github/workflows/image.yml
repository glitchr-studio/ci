# Builds ghcr.io/glitchr-studio/php:8.4 from image/php-8.4 and publishes it:
# on a change to the image, by hand, and on the first of each month (the
# base image's security fixes).
name: image

on:
  push:
    branches: [main]
    paths: ['image/**', '.github/workflows/image.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 4 1 * *'

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  php-8_4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image/php-8.4
          push: true
          tags: |
            ghcr.io/glitchr-studio/php:8.4
            ghcr.io/glitchr-studio/php:8.4-${{ github.sha }}
          cache-from: type=gha,scope=php-8.4
          cache-to: type=gha,mode=max,scope=php-8.4
          provenance: false
